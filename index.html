// ═══ Week View ═══

function WeekDayEntries({ dayEntries, settings }) {
  const pinned = dayEntries.filter(e => e.pinned);
  const unpinned = dayEntries.filter(e => !e.pinned);
  const [showAll, setShowAll] = React.useState(false);
  const visible = showAll ? dayEntries : pinned;

  const renderEntry = (entry) => {
    const author = settings.authors.find(a => a.id === entry.author);
    return (
      <div key={entry.id} className="week-entry-card" style={{
        background: `${author?.color}0a`, borderLeft: `3px solid ${author?.color}`,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 4 }}>
          <span style={{ width: 5, height: 5, borderRadius: '50%', background: author?.color }}/>
          <span style={{ fontSize: 10, color: author?.color, fontWeight: 600 }}>{author?.name}</span>
          {entry.pinned && <span style={{ fontSize: 9 }} title="已置顶">📌</span>}
        </div>
        <div style={{
          fontSize: 12, lineHeight: 1.5, color: 'var(--text-1)',
          overflow: 'hidden', textOverflow: 'ellipsis',
          display: '-webkit-box', WebkitLineClamp: 4, WebkitBoxOrient: 'vertical',
        }}>{stripHtml(entry.content)}</div>
      </div>
    );
  };

  if (dayEntries.length === 0) {
    return <div style={{ fontSize: 11, color: 'var(--text-3)', textAlign: 'center', padding: '12px 4px' }}>—</div>;
  }

  return (
    <>
      {visible.map(renderEntry)}
      {!showAll && pinned.length === 0 && unpinned.length > 0 && (
        <button onClick={() => setShowAll(true)} style={{
          width: '100%', fontSize: 10, color: 'var(--text-3)', padding: '4px 6px',
          background: 'var(--surface-2)', border: '1px dashed var(--border-light)',
          borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit',
        }}>展开 {unpinned.length} 条 ▾</button>
      )}
      {!showAll && pinned.length > 0 && unpinned.length > 0 && (
        <button onClick={() => setShowAll(true)} style={{
          width: '100%', fontSize: 10, color: 'var(--text-3)', padding: '3px 6px',
          background: 'none', border: '1px dashed var(--border-light)',
          borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit',
        }}>+{unpinned.length} ▾</button>
      )}
      {showAll && unpinned.length > 0 && (
        <button onClick={() => setShowAll(false)} style={{
          width: '100%', fontSize: 10, color: 'var(--text-3)', padding: '3px 6px',
          background: 'none', border: '1px dashed var(--border-light)',
          borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit',
        }}>收起 ▴</button>
      )}
    </>
  );
}

function WeekGrid({ year, month, weekNum, monday }) {
  const { settings, entries } = useDiary();
  const today = new Date();
  today.setHours(0,0,0,0);

  const weekDays = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    return d;
  });

  return (
    <div className="week-grid">
      {weekDays.map((d, i) => {
        const m = d.getMonth() + 1;
        const dy = d.getDate();
        const yr = d.getFullYear();
        const isToday = d.getTime() === today.getTime();
        const key = getEntryKey('day', yr, m, dy);
        const dayEntries = entries[key] || [];
        const anniversary = getAnniversary(settings, m, dy);

        return (
          <div key={i} className={`week-day-col ${isToday ? 'today' : ''}`}>
            <div className="week-day-header">
              <span className="week-day-name">{WEEKDAYS_ZH[i]}</span>
              <span className={`week-day-num ${isToday ? 'today' : ''}`}>{m}/{dy}</span>
              {anniversary && <span style={{ fontSize: 10, color: 'var(--month-note-text)' }}>·</span>}
            </div>
            <div className="week-day-entries">
              <WeekDayEntries dayEntries={dayEntries} settings={settings}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function WeekView({ year, month, day }) {
  const { settings } = useDiary();
  const weekNum = getMonthWeekNumber(year, month, day || 1);

  const refDate = new Date(year, month - 1, day || 1);
  const dow = (refDate.getDay() + 6) % 7;
  const monday = new Date(refDate);
  monday.setDate(monday.getDate() - dow);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      <WeekNoteBanner year={year} month={month} weekNum={weekNum} expanded/>

      <WeekGrid year={year} month={month} weekNum={weekNum} monday={monday}/>

      <div className="section-divider"><span>往年 第{weekNum}周</span></div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        {settings.years.filter(y => y !== year).reverse().map(y => {
          const pastMonday = getMondayOfMonthWeek(y, month, weekNum);
          return (
            <div key={y} style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-2)' }}>{y} · {month}月 第{weekNum}周</span>
              </div>
              <WeekNoteBanner year={y} month={month} weekNum={weekNum}/>
              <WeekGrid year={y} month={month} weekNum={weekNum} monday={pastMonday}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

Object.assign(window, { WeekView, WeekDayEntries, WeekGrid });

/* ===== diary/year-view.jsx ===== */
// ═══ Year View ═══

function YearView({ year }) {
  const { settings, entries, getEntries, updateEntry, deleteEntry } = useDiary();
  const today = new Date();

  // Year note
  const yearKey = getEntryKey('year', year);
  const yearEntries = entries[yearKey] || [];
  const [yearNoteOpen, setYearNoteOpen] = React.useState(false);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {/* Year note */}
      <div style={{
        background: 'var(--note-banner-bg)', border: '1px solid var(--note-banner-border)',
        borderRadius: 12, overflow: 'hidden',
      }}>
        <button onClick={() => setYearNoteOpen(!yearNoteOpen)} style={{
          width: '100%', display: 'flex', alignItems: 'center', gap: 8,
          padding: '10px 14px', background: 'none', border: 'none',
          cursor: 'pointer', fontFamily: 'inherit',
        }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--note-banner-text)' }}>📅 {year}年 年记</span>
          <AuthorDots entries={yearEntries} size={5}/>
          <span style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--text-3)', transition: 'transform 0.2s', transform: yearNoteOpen ? 'rotate(0)' : 'rotate(-90deg)' }}>▾</span>
        </button>
        {yearNoteOpen && (
          <div style={{ padding: '0 14px 12px', display: 'flex', flexDirection: 'column', gap: 6 }}>
            {yearEntries.map(e => (
              <EntryCard key={e.id} entry={e}
                onEdit={(id, c) => updateEntry(yearKey, id, c)}
                onDelete={(id) => deleteEntry(yearKey, id)}/>
            ))}
            <WriteBox entryKey={yearKey} placeholder={`写下${year}年的年记...`}/>
          </div>
        )}
      </div>

      {/* 12 month grid */}
      <div className="year-month-grid">
        {Array.from({ length: 12 }, (_, mi) => {
          const m = mi + 1;
          const daysInMonth = getDaysInMonth(year, m);
          const firstDay = getFirstDayOfMonth(year, m);
          const isCurrent = today.getFullYear() === year && today.getMonth() + 1 === m;
          const monthKey = getEntryKey('month', year, m);
          const monthEntries = entries[monthKey] || [];

          // Count entries per day for heatmap
          let totalEntries = 0;
          let humanCount = 0;
          let llmCount = 0;
          for (let d = 1; d <= daysInMonth; d++) {
            const dk = getEntryKey('day', year, m, d);
            const de = entries[dk] || [];
            totalEntries += de.length;
            humanCount += de.filter(e => e.author === 'human').length;
            llmCount += de.filter(e => e.author === 'llm').length;
          }

          return (
            <div key={mi} className={`year-month-card ${isCurrent ? 'current' : ''}`}
              onClick={() => {
                if (window.__navRef) {
                  window.__navRef.setMonth(m);
                  window.__navRef.setView('month');
                }
              }}
            >
              <div className="year-month-header">
                <span className="year-month-name">{MONTHS_ZH[mi]}</span>
                {monthEntries.length > 0 && <span style={{ fontSize: 10 }}>📝</span>}
              </div>

              {/* Mini heatmap */}
              <div className="year-mini-cal">
                {Array.from({ length: firstDay }, (_, i) => (
                  <div key={`e${i}`} className="year-mini-day empty"/>
                ))}
                {Array.from({ length: daysInMonth }, (_, i) => {
                  const d = i + 1;
                  const dk = getEntryKey('day', year, m, d);
                  const de = entries[dk] || [];
                  const isToday = today.getFullYear() === year && today.getMonth() + 1 === m && today.getDate() === d;
                  const hasHuman = de.some(e => e.author === 'human');
                  const hasLLM = de.some(e => e.author === 'llm');
                  
                  let bg = 'var(--surface-2)';
                  if (hasHuman && hasLLM) bg = 'linear-gradient(135deg, var(--human-color) 50%, var(--llm-color) 50%)';
                  else if (hasHuman) bg = 'var(--human-color)';
                  else if (hasLLM) bg = 'var(--llm-color)';
                  
                  return (
                    <div key={d} className={`year-mini-day ${de.length > 0 ? 'has' : ''} ${isToday ? 'today' : ''}`}
                      style={{ background: bg, opacity: de.length > 0 ? 0.5 + Math.min(de.length * 0.15, 0.5) : 1 }}
                      title={`${m}/${d}: ${de.length}条记录`}
                    />
                  );
                })}
              </div>

              {/* Stats */}
              <div className="year-month-stats">
                {totalEntries > 0 ? (
                  <>
                    <span style={{ color: 'var(--human-color)' }}>{humanCount}</span>
                    <span style={{ color: 'var(--text-3)' }}>/</span>
                    <span style={{ color: 'var(--llm-color)' }}>{llmCount}</span>
                  </>
                ) : (
                  <span style={{ color: 'var(--text-3)' }}>—</span>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Year management */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'center',
        padding: '12px 0', flexWrap: 'wrap',
      }}>
        <span style={{ fontSize: 12, color: 'var(--text-3)' }}>年份：</span>
        {settings.years.map(y => (
          <button key={y}
            type="button"
            onClick={() => { if (window.__navRef) window.__navRef.setYear(y); }}
            style={{
              padding: '5px 14px', borderRadius: 8, fontSize: 12,
              background: y === year ? 'var(--accent)' : 'var(--surface-2)',
              color: y === year ? '#fff' : 'var(--text-2)',
              border: 'none', cursor: 'pointer', fontWeight: y === year ? 600 : 400,
              fontFamily: 'inherit',
            }}
          >{y}</button>
        ))}
        <button onClick={() => {
          const next = Math.max(...settings.years) + 1;
          const { addYear } = window.__diaryRef;
          addYear(next);
        }} style={{
          padding: '5px 14px', borderRadius: 8, fontSize: 12,
          background: 'none', border: '1px dashed var(--accent)',
          color: 'var(--accent)', cursor: 'pointer', fontFamily: 'inherit',
        }}>+ {Math.max(...settings.years) + 1}</button>
      </div>
    </div>
  );
}

Object.assign(window, { YearView });

</script>
<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": false
}/*EDITMODE-END*/;

function App() {
  const today = new Date();
  const [view, setView] = React.useState(() => localStorage.getItem('diary_view') || 'month');
  const [year, setYear] = React.useState(() => parseInt(localStorage.getItem('diary_year')) || today.getFullYear());
  const [month, setMonth] = React.useState(() => parseInt(localStorage.getItem('diary_month')) || today.getMonth() + 1);
  const [day, setDay] = React.useState(() => parseInt(localStorage.getItem('diary_day')) || today.getDate());
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [dark, setDark] = React.useState(TWEAK_DEFAULTS.darkMode);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);
  const [gistSetupOpen, setGistSetupOpen] = React.useState(() => {
    try {
      const hasCreds = localStorage.getItem('nyear_diary_gist_id') && localStorage.getItem('nyear_diary_gist_token');
      const skipped = localStorage.getItem('nyear_diary_gist_setup_skipped') === '1';
      return !hasCreds && !skipped;
    } catch(e) { return false; }
  });

  React.useEffect(() => {
    window.__openGistSetup = () => setGistSetupOpen(true);
    return () => { window.__openGistSetup = null; };
  }, []);

  React.useEffect(() => {
    localStorage.setItem('diary_view', view);
    localStorage.setItem('diary_year', year);
    localStorage.setItem('diary_month', month);
    localStorage.setItem('diary_day', day);
  }, [view, year, month, day]);

  React.useEffect(() => {
    window.__navRef = { setView, setYear, setMonth, setDay };
    return () => { window.__navRef = null; };
  }, []);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  // Tweaks protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const navigate = (dir) => {
    if (view === 'year') {
      setYear(year + dir);
    } else if (view === 'month') {
      let m = month + dir, y = year;
      if (m > 12) { m = 1; y++; } if (m < 1) { m = 12; y--; }
      setMonth(m); setYear(y);
    } else if (view === 'day') {
      const d = new Date(year, month - 1, day + dir);
      setYear(d.getFullYear()); setMonth(d.getMonth() + 1); setDay(d.getDate());
    } else if (view === 'week') {
      const d = new Date(year, month - 1, day + dir * 7);
      setYear(d.getFullYear()); setMonth(d.getMonth() + 1); setDay(d.getDate());
    }
  };

  const goToday = () => {
    const t = new Date();
    setYear(t.getFullYear()); setMonth(t.getMonth() + 1); setDay(t.getDate());
  };

  const getTitle = () => {
    if (view === 'day') return `${year}年 ${month}月${day}日`;
    if (view === 'week') {
      const wn = getMonthWeekNumber(year, month, day);
      return `${year}年 ${month}月 第${wn}周`;
    }
    if (view === 'year') return `${year}年`;
    return `${year}年 ${month}月`;
  };

  // Sidebar icons as simple SVG paths (no emoji)
  const icons = {
    month: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5 1v4M11 1v4"/></svg>,
    week: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12"/><path d="M6 3v11M10 3v11" strokeDasharray="2 2"/></svg>,
    day: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="2" width="10" height="12" rx="2"/><path d="M6 6h4M6 9h3"/></svg>,
    year: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>,
    settings: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1v2.2M8 12.8V15M1 8h2.2M12.8 8H15M3.05 3.05l1.55 1.55M11.4 11.4l1.55 1.55M3.05 12.95l1.55-1.55M11.4 4.6l1.55-1.55"/></svg>,
    search: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>,
    theme: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="8" cy="8" r="5"/><path d="M8 3a5 5 0 010 10" fill="currentColor"/></svg>,
    exportIcon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 2v8M5 7l3 3 3-3M3 12h10"/></svg>,
    importIcon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 10V2M5 5l3-3 3 3M3 12h10"/></svg>,
    addYear: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M8 4v8M4 8h8"/></svg>,
  };

  return (
    <DiaryProvider>
      <DiaryRefSetter/>
      <div className="app-shell">
        <aside className="sidebar">
          <div className="sidebar-header">
            <div className="sidebar-logo">N年<span>日记</span></div>
            <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4, fontStyle: 'italic' }}>与妘音姐姐共同书写的时光</div>
          </div>
          
          <div className="sidebar-section">
            <div className="sidebar-section-title">视图</div>
            {[
              { id: 'month', icon: icons.month, label: '月历' },
              { id: 'week', icon: icons.week, label: '周历' },
              { id: 'day', icon: icons.day, label: '日历' },
              { id: 'year', icon: icons.year, label: '年历' },
            ].map(v => (
              <button key={v.id} className={`sidebar-btn ${view === v.id ? 'active' : ''}`}
                onClick={() => setView(v.id)}>
                <span className="sidebar-icon">{v.icon}</span>{v.label}
              </button>
            ))}
          </div>

          <div className="sidebar-section">
            <div className="sidebar-section-title">工具</div>
            <button className="sidebar-btn" onClick={() => setSearchOpen(true)}>
              <span className="sidebar-icon">{icons.search}</span>搜索
            </button>
            <button className={`sidebar-btn ${view === 'settings' ? 'active' : ''}`} onClick={() => setView('settings')}>
              <span className="sidebar-icon">{icons.settings}</span>设置
            </button>
            <button className="sidebar-btn" onClick={() => setDark(!dark)}>
              <span className="sidebar-icon">{icons.theme}</span>
              {dark ? '浅色模式' : '深色模式'}
            </button>
          </div>

          <div className="sidebar-bottom">
            <DataTools icons={icons}/>
          </div>
        </aside>

        <main className="main-content">
          <div className="main-inner">
            {view !== 'settings' && (
              <NavHeader view={view} onViewChange={setView} year={year} month={month}
                onPrev={() => navigate(-1)} onNext={() => navigate(1)}
                onToday={goToday} title={getTitle()}/>
            )}

            {view === 'month' && <MonthView year={year} month={month}/>}
            {view === 'day' && <DayView year={year} month={month} day={day} onBack={() => setView('month')}/>}
            {view === 'week' && <WeekView year={year} month={month} day={day}/>}
            {view === 'year' && <YearView year={year}/>}
            {view === 'settings' && <SettingsView/>}
          </div>
        </main>

        <div className="mobile-bottom-bar">
          <div className="bottom-tabs">
            {[
              { id: 'month', icon: icons.month, label: '月' },
              { id: 'week', icon: icons.week, label: '周' },
              { id: 'day', icon: icons.day, label: '日' },
              { id: 'year', icon: icons.year, label: '年' },
              { id: 'settings', icon: icons.settings, label: '设置' },
              { id: 'search', icon: icons.search, label: '搜索' },
              { id: 'dark', icon: icons.theme, label: dark ? '浅色' : '深色' },
            ].map(v => (
              <button key={v.id} className={`bottom-tab ${view === v.id ? 'active' : ''}`}
                onClick={() => {
                  if (v.id === 'search') setSearchOpen(true);
                  else if (v.id === 'dark') setDark(!dark);
                  else setView(v.id);
                }}>
                <span className="bottom-tab-icon">{v.icon}</span>
                {v.label}
              </button>
            ))}
          </div>
        </div>

        <SearchModal open={searchOpen} onClose={() => setSearchOpen(false)}/>
        <GistSetupModal open={gistSetupOpen} onClose={() => setGistSetupOpen(false)}/>
        {tweaksVisible && <TweaksPanel dark={dark} setDark={setDark}/>}
      </div>
    </DiaryProvider>
  );
}

function DiaryRefSetter() {
  const diary = useDiary();
  React.useEffect(() => { window.__diaryRef = diary; return () => { window.__diaryRef = null; }; }, [diary]);
  return null;
}

function DataTools({ icons }) {
  const { doExport, doImport, addYear, settings } = useDiary();
  const fileRef = React.useRef(null);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div className="sidebar-section-title">数据</div>
      <button className="sidebar-btn" onClick={doExport}>
        <span className="sidebar-icon">{icons.exportIcon}</span>导出 JSON
      </button>
      <button className="sidebar-btn" onClick={() => fileRef.current?.click()}>
        <span className="sidebar-icon">{icons.importIcon}</span>导入 JSON
      </button>
      <input ref={fileRef} type="file" accept=".json" style={{ display: 'none' }}
        onChange={async (e) => { if (e.target.files[0]) { await doImport(e.target.files[0]); e.target.value = ''; } }}/>
      <button className="sidebar-btn" onClick={() => addYear(Math.max(...settings.years) + 1)}>
        <span className="sidebar-icon">{icons.addYear}</span>添加 {Math.max(...settings.years) + 1} 年
      </button>
    </div>
  );
}

function TweaksPanel({ dark, setDark }) {
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, width: 220,
      background: 'var(--bg-card)', border: '1px solid var(--border)',
      borderRadius: 10, boxShadow: '0 8px 30px rgba(0,0,0,0.12)',
      padding: 16, zIndex: 999, fontFamily: 'var(--font-sans)',
    }}>
      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: 'var(--text-1)', fontFamily: 'var(--font-serif)' }}>Tweaks</div>
      <label style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 12, color: 'var(--text-2)' }}>
        深色模式
        <input type="checkbox" checked={dark} onChange={e => setDark(e.target.checked)}/>
      </label>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
