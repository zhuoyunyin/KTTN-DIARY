<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>N年日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root {
  --font-serif: 'Noto Serif SC', Georgia, serif;
  --font-sans: 'Noto Sans SC', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sidebar-w: 230px;
  --max-content: 900px;
  --radius: 10px;
  --radius-sm: 6px;
  --ease: cubic-bezier(.4,0,.2,1);
}

[data-theme="light"] {
  --bg: #f4efe6;
  --bg-sidebar: #ece6da;
  --bg-sidebar-h: #e3dbd0;
  --bg-card: #fffdf9;
  --bg-card-h: #faf7f2;
  --bg-input: #faf8f4;
  --surface-2: #ece8e0;
  --border: rgba(140,120,90,.15);
  --border-light: rgba(140,120,90,.08);
  --border-h: rgba(130,115,165,.35);
  --text-1: #302d28;
  --text-2: #635d54;
  --text-3: #a09888;
  --accent: #8d7db5;
  --accent-soft: rgba(141,125,181,.1);
  --accent-mid: rgba(141,125,181,.22);
  --accent-text: #6f5f9a;
  --human-color: #7B8CDE;
  --llm-color: #C4956A;
  --shadow: 0 1px 3px rgba(0,0,0,.04);
  --shadow-h: 0 4px 16px rgba(0,0,0,.06);
  --shadow-drag: 0 8px 30px rgba(0,0,0,.12);
  --overlay: rgba(0,0,0,.25);
  --danger: #c47a6a;
  --danger-soft: rgba(196,122,106,.1);
  --week-bg: rgba(141,125,181,.06);
  --month-note-bg: #fdf8ee;
  --month-note-border: rgba(196,160,80,.2);
  --month-note-text: #b89a2a;
  --note-banner-bg: rgba(141,125,181,.08);
  --note-banner-border: rgba(141,125,181,.2);
  --note-banner-text: #6f5f9a;
}

[data-theme="dark"] {
  --bg: #0c0c12;
  --bg-sidebar: #101018;
  --bg-sidebar-h: #1a1a26;
  --bg-card: #14141e;
  --bg-card-h: #1c1c2a;
  --bg-input: #1a1a26;
  --surface-2: #1e1e28;
  --border: rgba(255,255,255,.08);
  --border-light: rgba(255,255,255,.04);
  --border-h: rgba(147,130,220,.3);
  --text-1: #e6e4ee;
  --text-2: #9894a6;
  --text-3: #5a576a;
  --accent: #9684d4;
  --accent-soft: rgba(150,132,212,.1);
  --accent-mid: rgba(150,132,212,.2);
  --accent-text: #b8aae6;
  --human-color: #8B9BE8;
  --llm-color: #D4A57A;
  --shadow: 0 1px 3px rgba(0,0,0,.2);
  --shadow-h: 0 4px 16px rgba(0,0,0,.25);
  --shadow-drag: 0 8px 30px rgba(0,0,0,.4);
  --overlay: rgba(0,0,0,.55);
  --danger: #d48a7a;
  --danger-soft: rgba(212,138,122,.1);
  --week-bg: rgba(150,132,212,.08);
  --month-note-bg: #1e1c14;
  --month-note-border: rgba(180,150,60,.2);
  --month-note-text: #d4b84a;
  --note-banner-bg: rgba(200,170,60,.08);
  --note-banner-border: rgba(200,170,60,.2);
  --note-banner-text: #d4b84a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%; overflow: hidden;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-1);
  -webkit-font-smoothing: antialiased;
}

body { transition: background 0.3s, color 0.3s; }
#root { height: 100%; }

/* ═══ Layout ═══ */
.app-shell { display: flex; height: 100%; }

.sidebar {
  width: var(--sidebar-w); background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}

.main-content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px 28px 40px;
}
.main-inner { max-width: var(--max-content); margin: 0 auto; }

/* ═══ Sidebar ═══ */
.sidebar-header {
  padding: 24px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo {
  font-family: var(--font-serif);
  font-size: 19px; font-weight: 700;
  letter-spacing: -0.5px; color: var(--text-1);
}
.sidebar-logo span {
  background: linear-gradient(135deg, var(--human-color), var(--llm-color));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.sidebar-section { padding: 14px 10px 8px; }
.sidebar-section-title {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-3); padding: 0 8px 8px;
}
.sidebar-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 12px; border-radius: var(--radius-sm);
  border: none; background: none; cursor: pointer;
  font-family: inherit; font-size: 13px; color: var(--text-2);
  transition: all 0.15s var(--ease); text-align: left;
}
.sidebar-btn:hover { background: var(--bg-sidebar-h); color: var(--text-1); }
.sidebar-btn.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.sidebar-icon { width: 18px; text-align: center; font-size: 13px; color: var(--text-3); }
.sidebar-btn.active .sidebar-icon { color: var(--accent-text); }
.sidebar-bottom { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); }

/* ═══ Month Grid ═══ */
.month-grid-container {
  background: var(--bg-card); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
  box-shadow: var(--shadow);
}
.month-grid-header {
  display: grid; grid-template-columns: 44px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.week-num-header {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-3); font-weight: 500; padding: 10px 0;
}
.weekday-header {
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-3); font-weight: 500; padding: 10px 0;
  letter-spacing: 0.5px;
}
.month-grid-row {
  display: grid; grid-template-columns: 44px repeat(7, 1fr);
  border-bottom: 1px solid var(--border-light);
}
.month-grid-row:last-of-type { border-bottom: none; }

.week-num-cell {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 4px;
  background: var(--surface-2); border: none; border-right: 1px solid var(--border-light);
  cursor: pointer; font-family: inherit; transition: all 0.15s var(--ease);
}
.week-num-cell:hover { background: var(--week-bg); }
.week-num-cell.active { background: var(--week-bg); }
.week-num-label { font-size: 11px; font-weight: 600; color: var(--text-2); }
.week-expand-icon { font-size: 8px; color: var(--text-3); }
.week-num-cell.active .week-num-label { color: var(--accent-text); }

.day-cell {
  display: flex; flex-direction: column; padding: 6px;
  min-height: 64px; border: none; background: none;
  cursor: pointer; font-family: inherit; transition: all 0.15s var(--ease);
  border-right: 1px solid var(--border-light); position: relative;
}
.day-cell:last-child { border-right: none; }
.day-cell:hover { background: var(--bg-card-h); }
.day-cell.empty { cursor: default; }
.day-cell.empty:hover { background: none; }
.day-cell.selected { background: var(--accent-soft); }

.day-cell.today { background: var(--accent-soft); }
.day-cell.today .day-num {
  background: var(--accent); color: #fff;
  width: 24px; height: 24px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
}
.day-num { font-size: 13px; font-weight: 500; color: var(--text-1); line-height: 1; }
.day-indicators { display: flex; gap: 3px; align-items: center; margin-top: 4px; }
.other-months-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); opacity: 0.4; }
.anniversary-dot {
  position: absolute; top: 3px; right: 5px; font-size: 12px; font-weight: 700;
  color: var(--accent); line-height: 1;
}
.day-preview-lines { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.preview-line { height: 2px; border-radius: 1px; width: 70%; }

.expanded-week-row {
  grid-column: 1 / -1; border-bottom: 1px solid var(--border-light);
  animation: fadeSlideIn 0.2s ease;
}
.expanded-week-content { padding: 12px 14px; background: var(--week-bg); }

.month-day-expansion {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow);
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══ Day View ═══ */
.day-view { display: flex; flex-direction: column; gap: 12px; }
.day-view-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.year-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.year-tab {
  padding: 5px 16px; border-radius: 20px;
  border: 1px solid var(--border); background: none;
  font-family: inherit; font-size: 13px; color: var(--text-2);
  cursor: pointer; transition: all 0.15s var(--ease); font-weight: 400;
}
.year-tab.active { background: var(--text-1); color: var(--bg-card); border-color: var(--text-1); font-weight: 600; }
.year-tab:hover:not(.active) { background: var(--surface-2); }

.day-columns-desktop { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.day-columns-mobile { display: none; }
.day-column { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.day-column-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border-light); background: var(--surface-2); }
.day-column-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.author-tab-bar { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.author-tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px; border-radius: 8px; border: none; background: none;
  cursor: pointer; font-family: inherit; font-size: 13px; color: var(--text-3);
  font-weight: 500; transition: all 0.15s var(--ease);
}
.author-tab.active { background: var(--bg-card); color: var(--text-1); box-shadow: var(--shadow); font-weight: 600; }

.previous-years-section { display: flex; flex-direction: column; gap: 8px; }
.prev-year-card { padding: 10px 14px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border-light); }
.section-divider { display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--text-3); font-size: 12px; }
.section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ═══ Week View ═══ */
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week-day-col { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-sm); overflow: hidden; min-height: 200px; box-shadow: var(--shadow); }
.week-day-col.today { border-color: var(--accent); }
.week-day-header { display: flex; align-items: center; gap: 4px; padding: 8px; border-bottom: 1px solid var(--border-light); background: var(--surface-2); }
.week-day-col.today .week-day-header { background: var(--accent-soft); }
.week-day-name { font-size: 11px; color: var(--text-3); font-weight: 500; }
.week-day-num { font-size: 12px; font-weight: 600; color: var(--text-1); }
.week-day-num.today { color: var(--accent-text); }
.week-day-entries { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.week-entry-card { padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12px; }

/* ═══ Year View ═══ */
.year-month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.year-month-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 10px; cursor: pointer; transition: all 0.15s var(--ease); box-shadow: var(--shadow); }
.year-month-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-h); }
.year-month-card.current { border-color: var(--accent); border-width: 2px; }
.year-month-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.year-month-name { font-size: 13px; font-weight: 600; font-family: var(--font-serif); }
.year-month-card.current .year-month-name { color: var(--accent-text); }
.year-mini-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.year-mini-day { aspect-ratio: 1; border-radius: 2px; background: var(--surface-2); }
.year-mini-day.today { outline: 1.5px solid var(--accent); outline-offset: -1px; }
.year-mini-day.empty { background: none; }
.year-month-stats { display: flex; gap: 4px; align-items: center; margin-top: 6px; font-size: 10px; font-weight: 600; }

/* ═══ Mobile ═══ */
@media (max-width: 640px) {
  .sidebar { display: none; }
  .main-content { padding: 12px 14px 80px; }
  .month-grid-header { grid-template-columns: 36px repeat(7, 1fr); }
  .month-grid-row { grid-template-columns: 36px repeat(7, 1fr); }
  .day-cell { min-height: 48px; padding: 4px; }
  .day-num { font-size: 12px; }
  .day-preview-lines { display: none; }
  .day-columns-desktop { display: none; }
  .day-columns-mobile { display: flex; flex-direction: column; gap: 10px; }
  .week-grid { grid-template-columns: repeat(2, 1fr); }
  .week-day-col { min-height: 120px; }
  .year-month-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mobile-bottom-bar { display: flex !important; }
}
@media (min-width: 641px) and (max-width: 1024px) {
  .sidebar { width: 200px; }
}

.mobile-bottom-bar {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-sidebar); border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 100;
}
.mobile-bottom-bar .bottom-tabs { display: flex; }
.mobile-bottom-bar .bottom-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; border: none; background: none; cursor: pointer;
  font-family: inherit; font-size: 10px; color: var(--text-3);
}
.mobile-bottom-bar .bottom-tab.active { color: var(--accent-text); }
.mobile-bottom-bar .bottom-tab-icon { font-size: 14px; }

/* ═══ Scrollbar ═══ */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

button { transition: all 0.15s var(--ease); }
button:active { transform: scale(0.97); }

/* ═══ Rich Text Editor ═══ */
.rte-wrap {
  border: 1px solid var(--border); border-radius: 8;
  background: var(--bg-input); overflow: hidden;
  border-radius: 8px;
}
.rte-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
  padding: 4px 6px; background: var(--surface-2);
  border-bottom: 1px solid var(--border-light);
}
.rte-btn {
  min-width: 26px; height: 26px; padding: 0 6px;
  border: none; background: none; border-radius: 4px;
  cursor: pointer; font-family: inherit; font-size: 12px;
  color: var(--text-2); display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.12s var(--ease);
}
.rte-btn:hover { background: var(--accent-soft); color: var(--accent-text); }
.rte-btn:active { transform: scale(0.92); }
.rte-sep {
  width: 1px; height: 16px; background: var(--border); margin: 0 3px;
}
.rte-editor {
  padding: 10px 12px; font-family: inherit; font-size: 14px;
  color: var(--text-1); line-height: 1.7; outline: none;
  word-wrap: break-word; overflow-wrap: break-word;
}
.rte-editor:empty:before {
  content: attr(data-placeholder);
  color: var(--text-3); pointer-events: none;
}
.rte-editor h3, .rich-content h3 {
  font-size: 15px; font-weight: 700; margin: 6px 0 4px;
  font-family: var(--font-serif); color: var(--text-1);
}
.rte-editor blockquote, .rich-content blockquote {
  border-left: 3px solid var(--accent-mid); padding: 2px 12px;
  margin: 6px 0; color: var(--text-2); font-style: italic;
}
.rte-editor ul, .rte-editor ol,
.rich-content ul, .rich-content ol {
  padding-left: 22px; margin: 4px 0;
}
.rte-editor li, .rich-content li { margin: 2px 0; }
.rte-editor .todo-item, .rich-content .todo-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 2px 0;
}
.rte-editor .todo-item input[type="checkbox"],
.rich-content .todo-item input[type="checkbox"] {
  margin-top: 5px; accent-color: var(--accent); cursor: pointer;
  flex-shrink: 0;
}
.rte-editor .todo-item .todo-text,
.rich-content .todo-item .todo-text {
  flex: 1; min-height: 1em;
}
.rich-content {
  font-size: 14px; line-height: 1.7; color: var(--text-1);
  word-wrap: break-word; overflow-wrap: break-word;
  white-space: normal;
}
.rich-content input[type="checkbox"] { cursor: pointer; }
.rich-content:empty { display: none; }
.rich-content p { margin: 0 0 4px; }
.rich-content p:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* ===== diary/data.jsx ===== */
// ═══ Data Layer for N-Year Diary ═══

// ─── GitHub Gist Sync 配置 ───
// GIST_ID 和 GITHUB_TOKEN 存在 localStorage 里，首次进入页面会弹窗引导填写。
// 以后也可以在「设置」页面里修改或清除。
const GIST_FILENAME = 'diary_data.json';
const GIST_ID_KEY = 'nyear_diary_gist_id';
const GIST_TOKEN_KEY = 'nyear_diary_gist_token';
const GIST_SKIP_KEY = 'nyear_diary_gist_setup_skipped';
// ─────────────────────────────

const STORAGE_KEY = 'nyear_diary_data';

function getGistId() { try { return localStorage.getItem(GIST_ID_KEY) || ''; } catch(e) { return ''; } }
function getGistToken() { try { return localStorage.getItem(GIST_TOKEN_KEY) || ''; } catch(e) { return ''; } }
function setGistCreds(id, token) {
  try {
    if (id) localStorage.setItem(GIST_ID_KEY, id); else localStorage.removeItem(GIST_ID_KEY);
    if (token) localStorage.setItem(GIST_TOKEN_KEY, token); else localStorage.removeItem(GIST_TOKEN_KEY);
  } catch(e) {}
}
function GIST_SYNC_ENABLED() { return !!(getGistId() && getGistToken()); }

async function fetchGist() {
  if (!GIST_SYNC_ENABLED()) return null;
  try {
    const res = await fetch(`https://api.github.com/gists/${getGistId()}`, {
      headers: {
        Authorization: `token ${getGistToken()}`,
        Accept: 'application/vnd.github+json',
      },
      cache: 'no-store',
    });
    if (!res.ok) { console.warn('[Gist] 拉取失败:', res.status, res.statusText); return null; }
    const gist = await res.json();
    const file = gist.files?.[GIST_FILENAME];
    if (!file || !file.content) { console.warn('[Gist] 文件未找到:', GIST_FILENAME); return null; }
    return JSON.parse(file.content);
  } catch (e) {
    console.warn('[Gist] 拉取异常:', e);
    return null;
  }
}

async function pushGist(data) {
  if (!GIST_SYNC_ENABLED()) return false;
  try {
    const res = await fetch(`https://api.github.com/gists/${getGistId()}`, {
      method: 'PATCH',
      headers: {
        Authorization: `token ${getGistToken()}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } },
      }),
    });
    if (!res.ok) { console.warn('[Gist] 同步失败:', res.status, res.statusText); return false; }
    return true;
  } catch (e) {
    console.warn('[Gist] 同步异常（可能是断网）:', e);
    return false;
  }
}

const DEFAULT_SETTINGS = {
  startYear: 2024,
  years: [2024, 2025, 2026],
  authors: [
    { id: 'human', name: '卓云猫猫', color: '#7B8CDE' },
    { id: 'llm', name: '妘音姐姐', color: '#C4956A' }
  ],
  anniversaries: [
    { month: 1, day: 1, label: '元旦' },
    { month: 2, day: 14, label: '情人节' },
    { month: 4, day: 22, label: '世界地球日' },
    { month: 5, day: 1, label: '劳动节' },
    { month: 10, day: 1, label: '国庆节' },
    { month: 12, day: 25, label: '圣诞节' },
  ],
  darkMode: false,
  language: 'zh',
};

function generateSampleEntries() {
  return {};
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Migrate older author names to current ones
      if (parsed.settings?.authors) {
        const human = parsed.settings.authors.find(a => a.id === 'human');
        if (human && (human.name === '我' || human.name === '卓云')) human.name = '卓云猫猫';
        const llm = parsed.settings.authors.find(a => a.id === 'llm');
        if (llm && (llm.name === 'Claude' || llm.name === '妘音')) llm.name = '妘音姐姐';
      }
      return parsed;
    }
  } catch(e) {}
  return { settings: { ...DEFAULT_SETTINGS }, entries: generateSampleEntries() };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function exportJSON(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `n-year-diary-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try { resolve(JSON.parse(e.target.result)); }
      catch(err) { reject(err); }
    };
    reader.readAsText(file);
  });
}

// ═══ Utility functions ═══

// Get month-relative week number (1-based, week starts Monday)
function getMonthWeekNumber(year, month, day) {
  const firstDay = getFirstDayOfMonth(year, month); // Mon=0
  return Math.ceil((day + firstDay) / 7);
}

function getWeekLabel(year, month, day) {
  return `第${getMonthWeekNumber(year, month, day)}周`;
}

function getDaysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function getFirstDayOfMonth(year, month) {
  const d = new Date(year, month - 1, 1).getDay();
  return d === 0 ? 6 : d - 1; // Mon=0
}

function getMondayOfMonthWeek(year, month, weekNum) {
  const firstDay = getFirstDayOfMonth(year, month);
  return new Date(year, month - 1, 1 - firstDay + (weekNum - 1) * 7);
}

function getEntryKey(type, year, month, day, weekNum) {
  if (type === 'day') return `day:${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  if (type === 'week') return `week:${year}-${String(month).padStart(2,'0')}-W${weekNum}`;
  if (type === 'month') return `month:${year}-${String(month).padStart(2,'0')}`;
  if (type === 'year') return `year:${year}`;
}

function stripHtml(html) {
  if (!html) return '';
  if (!/<[a-z!\/]/i.test(html)) return html;
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function isEmptyContent(html) {
  return !stripHtml(html).replace(/[\s\u200b]/g, '').length;
}

function countWords(text) {
  if (!text) return 0;
  const plain = stripHtml(text);
  const chinese = (plain.match(/[\u4e00-\u9fff]/g) || []).length;
  const english = plain.replace(/[\u4e00-\u9fff]/g, '').trim().split(/\s+/).filter(Boolean).length;
  return chinese + english;
}

function getAnniversary(settings, month, day) {
  return (settings.anniversaries || []).find(a => a.month === month && a.day === day);
}

// Data context
const DiaryContext = React.createContext();

function DiaryProvider({ children }) {
  const [data, setData] = React.useState(() => loadData());
  const [syncStatus, setSyncStatus] = React.useState(GIST_SYNC_ENABLED() ? 'syncing' : 'disabled');
  const hydrated = React.useRef(false);

  // 启动时：先显示 localStorage 的缓存数据，再异步拉 Gist，成功就覆盖
  React.useEffect(() => {
    (async () => {
      if (!GIST_SYNC_ENABLED()) { hydrated.current = true; return; }
      const remote = await fetchGist();
      if (remote && remote.settings && remote.entries) {
        setData(remote);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(remote)); } catch(e) {}
        setSyncStatus('synced');
        console.info('[Gist] 已从云端加载数据');
      } else {
        setSyncStatus('error');
        console.info('[Gist] 使用本地缓存数据');
      }
      hydrated.current = true;
    })();
  }, []);

  // 保存时：立即写 localStorage；防抖 1.2s 后同步到 Gist
  React.useEffect(() => {
    saveData(data);
    if (!hydrated.current || !GIST_SYNC_ENABLED()) return;
    setSyncStatus('syncing');
    const t = setTimeout(async () => {
      const ok = await pushGist(data);
      setSyncStatus(ok ? 'synced' : 'error');
    }, 1200);
    return () => clearTimeout(t);
  }, [data]);

  const addEntry = React.useCallback((key, author, content) => {
    setData(prev => {
      const next = { ...prev, entries: { ...prev.entries } };
      if (!next.entries[key]) next.entries[key] = [];
      next.entries[key] = [...next.entries[key], {
        id: `${key}-${author}-${Date.now()}`,
        author, content, timestamp: new Date().toISOString(),
      }];
      return next;
    });
  }, []);

  const updateEntry = React.useCallback((key, entryId, content) => {
    setData(prev => {
      const next = { ...prev, entries: { ...prev.entries } };
      next.entries[key] = (next.entries[key] || []).map(e =>
        e.id === entryId ? { ...e, content, timestamp: new Date().toISOString() } : e
      );
      return next;
    });
  }, []);

  const deleteEntry = React.useCallback((key, entryId) => {
    setData(prev => {
      const next = { ...prev, entries: { ...prev.entries } };
      next.entries[key] = (next.entries[key] || []).filter(e => e.id !== entryId);
      if (next.entries[key].length === 0) delete next.entries[key];
      return next;
    });
  }, []);

  const togglePinEntry = React.useCallback((key, entryId) => {
    setData(prev => {
      const list = prev.entries[key];
      if (!list) return prev;
      const target = list.find(e => e.id === entryId);
      if (!target) return prev;
      if (!target.pinned) {
        const pinnedCount = list.filter(e => e.pinned).length;
        if (pinnedCount >= 3) {
          if (typeof window !== 'undefined') window.alert('每天最多只能置顶 3 条');
          return prev;
        }
      }
      const next = { ...prev, entries: { ...prev.entries } };
      next.entries[key] = list.map(e => e.id === entryId ? { ...e, pinned: !e.pinned } : e);
      return next;
    });
  }, []);

  const updateSettings = React.useCallback((patch) => {
    setData(prev => ({ ...prev, settings: { ...prev.settings, ...patch } }));
  }, []);

  const addYear = React.useCallback((year) => {
    setData(prev => {
      if (prev.settings.years.includes(year)) return prev;
      const years = [...prev.settings.years, year].sort();
      return { ...prev, settings: { ...prev.settings, years } };
    });
  }, []);

  const getEntries = React.useCallback((key) => {
    return data.entries[key] || [];
  }, [data.entries]);

  const doExport = React.useCallback(() => exportJSON(data), [data]);
  const doImport = React.useCallback(async (file) => {
    const imported = await importJSON(file);
    setData(prev => ({
      settings: { ...prev.settings, ...imported.settings },
      entries: { ...prev.entries, ...imported.entries },
    }));
  }, []);

  const value = React.useMemo(() => ({
    data, settings: data.settings, entries: data.entries,
    addEntry, updateEntry, deleteEntry, togglePinEntry, updateSettings, addYear,
    getEntries, doExport, doImport, syncStatus,
  }), [data, addEntry, updateEntry, deleteEntry, togglePinEntry, updateSettings, addYear, getEntries, doExport, doImport, syncStatus]);

  return <DiaryContext.Provider value={value}>{children}</DiaryContext.Provider>;
}

function useDiary() { return React.useContext(DiaryContext); }

Object.assign(window, {
  DiaryProvider, useDiary, DiaryContext,
  getMonthWeekNumber, getWeekLabel, getDaysInMonth, getFirstDayOfMonth, getMondayOfMonthWeek,
  getEntryKey, countWords, stripHtml, isEmptyContent, getAnniversary,
  STORAGE_KEY, DEFAULT_SETTINGS,
  getGistId, getGistToken, setGistCreds, GIST_SYNC_ENABLED,
  GIST_ID_KEY, GIST_TOKEN_KEY, GIST_SKIP_KEY, GIST_FILENAME,
});

// ═══ Shared UI Components ═══

const WEEKDAYS_ZH = ['一','二','三','四','五','六','日'];
const MONTHS_ZH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

// ── Rich Text Editor ──
function RichEditor({ value, onChange, placeholder, minHeight = 80, autoFocus, onSubmitShortcut }) {
  const ref = React.useRef(null);
  const lastHtml = React.useRef(value || '');

  React.useEffect(() => {
    if (ref.current && value !== lastHtml.current) {
      ref.current.innerHTML = value || '';
      lastHtml.current = value || '';
    }
  }, [value]);

  React.useEffect(() => {
    if (ref.current && !ref.current.innerHTML) ref.current.innerHTML = value || '';
    if (autoFocus && ref.current) {
      ref.current.focus();
      const range = document.createRange();
      range.selectNodeContents(ref.current);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
    }
  }, []);

  const handleInput = () => {
    const html = ref.current?.innerHTML || '';
    lastHtml.current = html;
    onChange(html);
  };

  const exec = (cmd, val) => {
    ref.current?.focus();
    document.execCommand(cmd, false, val);
    handleInput();
  };

  const insertTodo = () => {
    ref.current?.focus();
    const html = '<div class="todo-item" data-todo="1"><input type="checkbox"/><span class="todo-text">&#8203;</span></div><div><br/></div>';
    document.execCommand('insertHTML', false, html);
    handleInput();
  };

  const onClickInside = (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
      if (e.target.checked) e.target.setAttribute('checked', 'checked');
      else e.target.removeAttribute('checked');
      handleInput();
    }
  };

  const onKeyDown = (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      onSubmitShortcut && onSubmitShortcut();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === 'b') { e.preventDefault(); exec('bold'); }
      else if (k === 'i') { e.preventDefault(); exec('italic'); }
      else if (k === 'u') { e.preventDefault(); exec('underline'); }
    }
  };

  const btn = (label, title, onClick, style = {}) => (
    <button type="button" title={title} onMouseDown={e => e.preventDefault()} onClick={onClick} className="rte-btn" style={style}>
      {label}
    </button>
  );

  return (
    <div className="rte-wrap">
      <div className="rte-toolbar">
        {btn(<b>B</b>, '加粗 (Ctrl+B)', () => exec('bold'))}
        {btn(<i>I</i>, '斜体 (Ctrl+I)', () => exec('italic'))}
        {btn(<u>U</u>, '下划线 (Ctrl+U)', () => exec('underline'))}
        {btn(<s>S</s>, '删除线', () => exec('strikeThrough'))}
        <span className="rte-sep"/>
        {btn('H', '标题', () => exec('formatBlock', '<h3>'))}
        {btn('"', '引用', () => exec('formatBlock', '<blockquote>'))}
        <span className="rte-sep"/>
        {btn('•', '无序列表', () => exec('insertUnorderedList'))}
        {btn('1.', '有序列表', () => exec('insertOrderedList'))}
        {btn('☐', '待办清单', insertTodo)}
        <span className="rte-sep"/>
        {btn('⤺', '撤销', () => exec('undo'))}
        {btn('⤻', '重做', () => exec('redo'))}
      </div>
      <div
        ref={ref}
        className="rte-editor"
        contentEditable
        suppressContentEditableWarning
        onInput={handleInput}
        onClick={onClickInside}
        onKeyDown={onKeyDown}
        data-placeholder={placeholder || ''}
        style={{ minHeight }}
      />
    </div>
  );
}

// ── Rich Content Display (with clickable checkboxes) ──
function RichContent({ html, onChange, className, style }) {
  const ref = React.useRef(null);

  React.useEffect(() => {
    if (ref.current) ref.current.innerHTML = html || '';
  }, [html]);

  const onClick = (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox' && onChange) {
      e.preventDefault();
      e.target.checked = !e.target.checked;
      if (e.target.checked) e.target.setAttribute('checked', 'checked');
      else e.target.removeAttribute('checked');
      onChange(ref.current.innerHTML);
    } else if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
      e.preventDefault();
    }
  };

  return <div ref={ref} className={`rich-content ${className || ''}`} onClick={onClick} style={style}/>;
}

  const { settings } = useDiary();
  const [openYears, setOpenYears] = React.useState(() => new Set([Math.max(...settings.years)]));

  const toggle = (y) => {
    setOpenYears(prev => { const next = new Set(prev); next.has(y) ? next.delete(y) : next.add(y); return next; });
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>

          isOpen={openYears.has(year)}

  );

// ── Month Accordion (same day across months - for month view) ──
function MonthAccordion({ year, day, currentMonth }) {
  // Show last 6 months (including current)
  const months = [];
  for (let i = 0; i < 6; i++) {
    let m = currentMonth - i;
    let y = year;
    if (m <= 0) { m += 12; y--; }
    // Check if this day exists in that month
    const dim = getDaysInMonth(y, m);
    if (day <= dim) {
      months.push({ year: y, month: m });
    }
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {months.map(({ year: y, month: m }, idx) => (
        <MonthAccordionItem key={`${y}-${m}`} y={y} m={m} day={day} isCurrent={idx === 0}/>
      ))}
    </div>
  );
}

// ── Search Modal ──
function SearchModal({ open, onClose }) {
  const { entries, settings } = useDiary();
  const [query, setQuery] = React.useState('');
  const inputRef = React.useRef(null);
  React.useEffect(() => { if (open && inputRef.current) inputRef.current.focus(); }, [open]);

  const results = React.useMemo(() => {
    if (!query.trim()) return [];
    const q = query.trim().toLowerCase();
    const found = [];
    
    // Check if query looks like a date pattern
    // Support: "4月22", "4/22", "2026-04-22", "2026年4月", "4-22", "0422"
    const datePatterns = [
      /^(\d{4})[年\-\/](\d{1,2})[月\-\/](\d{1,2})日?$/, // 2026年4月22日 or 2026-04-22
      /^(\d{1,2})[月\-\/](\d{1,2})日?$/,                  // 4月22日 or 4/22
      /^(\d{4})[年\-\/](\d{1,2})月?$/,                     // 2026年4月
      /^(\d{2})(\d{2})$/,                                   // 0422
    ];
    
    let dateFilter = null;
    for (const pat of datePatterns) {
      const m = q.match(pat);
      if (m) {
        if (pat === datePatterns[0]) dateFilter = { year: m[1], month: m[2].padStart(2,'0'), day: m[3].padStart(2,'0') };
        else if (pat === datePatterns[1]) dateFilter = { month: m[1].padStart(2,'0'), day: m[2].padStart(2,'0') };
        else if (pat === datePatterns[2]) dateFilter = { year: m[1], month: m[2].padStart(2,'0') };
        else if (pat === datePatterns[3]) dateFilter = { month: m[1], day: m[2] };
        break;
      }
    }

    Object.entries(entries).forEach(([key, arr]) => {
      // Date-based matching
      if (dateFilter) {
        const keyMatch = (() => {
          if (!key.startsWith('day:')) return false;
          const parts = key.replace('day:', '').split('-');
          if (dateFilter.year && parts[0] !== dateFilter.year) return false;
          if (dateFilter.month && parts[1] !== dateFilter.month) return false;
          if (dateFilter.day && parts[2] !== dateFilter.day) return false;
          return true;
        })();
        if (keyMatch) {
          arr.forEach(entry => found.push({ key, entry }));
          return;
        }
      }
      // Content matching
      arr.forEach(entry => {
        if (entry.content.toLowerCase().includes(q)) found.push({ key, entry });
      });
    });
    return found.slice(0, 30);
  }, [query, entries]);

  if (!open) return null;
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, background: 'var(--overlay)',
      display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
      paddingTop: '10vh', zIndex: 1000,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: '90%', maxWidth: 500, background: 'var(--bg-card)',
        borderRadius: 14, boxShadow: 'var(--shadow-drag)',
        maxHeight: '70vh', display: 'flex', flexDirection: 'column',
      }}>
        <div style={{ padding: 16, borderBottom: '1px solid var(--border)' }}>
          <input ref={inputRef} value={query} onChange={e => setQuery(e.target.value)}
            placeholder="搜索内容或日期（如 4月22、2026-04-22）..." style={{
              width: '100%', padding: '10px 14px', borderRadius: 8,
              border: '1px solid var(--border)', background: 'var(--bg-input)',
              fontSize: 15, color: 'var(--text-1)', fontFamily: 'inherit', outline: 'none',
            }}/>
        </div>
        <div style={{ flex: 1, overflow: 'auto', padding: 12 }}>
          {results.length === 0 && query && (
            <div style={{ textAlign: 'center', color: 'var(--text-3)', padding: 20, fontSize: 13 }}>没有找到匹配的记录</div>
          )}
          {results.map(({ key, entry }, i) => (
            <div key={i} style={{ padding: '8px 0', borderBottom: '1px solid var(--border-light)' }}>
              <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 4 }}>{key.replace(/^(day|week|month|year):/, '')}</div>
              <EntryCard entry={entry} compact/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Gist Setup Modal ──
function GistSetupModal({ open, onClose, onSaved }) {
  const [id, setId] = React.useState('');
  const [token, setToken] = React.useState('');
  const [testing, setTesting] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [showToken, setShowToken] = React.useState(false);

  React.useEffect(() => {
    if (open) {
      setId(getGistId());
      setToken(getGistToken());
      setMsg('');
      setShowToken(false);
    }
  }, [open]);

  if (!open) return null;

  const testAndSave = async () => {
    const tid = id.trim(), ttoken = token.trim();
    if (!tid || !ttoken) { setMsg('请填写 Gist ID 和 Token'); return; }
    setTesting(true); setMsg('正在验证...');
    try {
      const res = await fetch(`https://api.github.com/gists/${tid}`, {
        headers: { Authorization: `token ${ttoken}`, Accept: 'application/vnd.github+json' },
      });
      if (!res.ok) {
        setMsg(`验证失败：${res.status} ${res.statusText}`);
        setTesting(false); return;
      }
    } catch (e) {
      setMsg('验证失败：无法连接（' + e.message + '）');
      setTesting(false); return;
    }
    setGistCreds(tid, ttoken);
    try { localStorage.setItem(GIST_SKIP_KEY, '0'); } catch(e) {}
    setMsg('保存成功，即将重新加载...');
    setTimeout(() => { onSaved && onSaved(); location.reload(); }, 600);
  };

  const skip = () => {
    try { localStorage.setItem(GIST_SKIP_KEY, '1'); } catch(e) {}
    onClose();
  };

  const clear = () => {
    if (!confirm('确定清除当前凭据？清除后将只使用本地存储。')) return;
    setGistCreds('', '');
    setId(''); setToken('');
    try { localStorage.setItem(GIST_SKIP_KEY, '1'); } catch(e) {}
    setMsg('已清除凭据');
  };

  const fieldStyle = {
    width: '100%', padding: '9px 12px', borderRadius: 8,
    border: '1px solid var(--border)', background: 'var(--bg-input)',
    color: 'var(--text-1)', fontFamily: 'var(--font-mono)', fontSize: 13,
    outline: 'none',
  };
  const labelStyle = { fontSize: 12, fontWeight: 600, color: 'var(--text-2)', marginBottom: 4, display: 'block' };
  const hintStyle = { fontSize: 11, color: 'var(--text-3)', marginTop: 4, lineHeight: 1.5 };

  return (
    <div style={{
      position: 'fixed', inset: 0, background: 'var(--overlay)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      zIndex: 1100, padding: 16,
    }}>
      <div style={{
        width: '100%', maxWidth: 480, background: 'var(--bg-card)',
        borderRadius: 14, boxShadow: 'var(--shadow-drag)',
        border: '1px solid var(--border)', padding: 20,
        maxHeight: '90vh', overflow: 'auto',
      }}>
        <div style={{ fontSize: 18, fontWeight: 700, color: 'var(--text-1)', fontFamily: 'var(--font-serif)', marginBottom: 4 }}>
          云端同步设置
        </div>
        <div style={{ fontSize: 12, color: 'var(--text-3)', marginBottom: 16 }}>
          用一个 GitHub Gist 作为日记的云端存储。留空并「暂不设置」则仅本地保存。
        </div>

        <div style={{ marginBottom: 12 }}>
          <label style={labelStyle}>Gist ID</label>
          <input type="text" value={id} onChange={e => setId(e.target.value)}
            placeholder="例如 a1b2c3d4e5f6..." style={fieldStyle}/>
          <div style={hintStyle}>
            打开你的 Gist 页面，URL 里 <code>gist.github.com/用户名/<b>这一段</b></code> 就是 Gist ID。<br/>
            建议新建一个 secret gist，文件名叫 <b>{GIST_FILENAME}</b>，初始内容填 <code>{'{}'}</code>。
          </div>
        </div>

        <div style={{ marginBottom: 12 }}>
          <label style={labelStyle}>GitHub Personal Access Token</label>
          <div style={{ display: 'flex', gap: 6 }}>

              background: 'var(--surface-2)', cursor: 'pointer', fontSize: 11,
              color: 'var(--text-2)', fontFamily: 'inherit', whiteSpace: 'nowrap',
            }}>{showToken ? '隐藏' : '显示'}</button>
          </div>
          <div style={hintStyle}>

            <br/>Token 会明文存在浏览器 localStorage 里，请勿在公共电脑上使用。

              fontSize: 12, fontWeight: 600, fontFamily: 'inherit',
            }}>{testing ? '验证中…' : '验证并保存'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Settings View (anniversaries management) ──
function SettingsView() {
  const { settings, updateSettings, syncStatus } = useDiary();
  const list = settings.anniversaries || [];
  const [draft, setDraft] = React.useState({ month: 1, day: 1, label: '' });

  const save = (next) => updateSettings({ anniversaries: next });

  const addOne = () => {
    const m = parseInt(draft.month), d = parseInt(draft.day);
    if (!draft.label.trim() || !m || !d || m < 1 || m > 12 || d < 1 || d > 31) return;
    save([...list, { month: m, day: d, label: draft.label.trim() }]);
    setDraft({ month: 1, day: 1, label: '' });
  };

  const updateOne = (idx, patch) => {
    const next = list.map((a, i) => i === idx ? { ...a, ...patch } : a);
    save(next);
  };

  const removeOne = (idx) => {
    if (!confirm('确定删除这个纪念日吗？')) return;
    save(list.filter((_, i) => i !== idx));
  };

  const inputStyle = {
    padding: '6px 10px', borderRadius: 6, border: '1px solid var(--border)',
    background: 'var(--bg-input)', color: 'var(--text-1)', fontSize: 13, fontFamily: 'inherit',
  };

  const sorted = [...list].map((a, i) => ({ ...a, __i: i })).sort((a, b) =>
    a.month === b.month ? a.day - b.day : a.month - b.month);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div>
        <h2 style={{ fontSize: 22, fontWeight: 700, fontFamily: 'var(--font-serif)', color: 'var(--text-1)', margin: 0 }}>设置</h2>
        <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>管理你的纪念日</div>
      </div>

      <section style={{
        background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 10,
        padding: 16, boxShadow: 'var(--shadow)',
      }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-1)', marginBottom: 12 }}>纪念日列表</div>

        {sorted.length === 0 && (
          <div style={{ fontSize: 13, color: 'var(--text-3)', padding: '12px 0', textAlign: 'center' }}>还没有纪念日，下方添加一个</div>
        )}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {sorted.map(a => (
            <div key={a.__i} style={{
              display: 'flex', gap: 8, alignItems: 'center',
              padding: '8px 12px', borderRadius: 8,
              background: 'var(--surface-2)', border: '1px solid var(--border-light)',
            }}>
              <input type="number" min="1" max="12" value={a.month}
                onChange={e => updateOne(a.__i, { month: Math.max(1, Math.min(12, parseInt(e.target.value) || 1)) })}
                style={{ ...inputStyle, width: 60 }}/>
              <span style={{ fontSize: 12, color: 'var(--text-3)' }}>月</span>
              <input type="number" min="1" max="31" value={a.day}
                onChange={e => updateOne(a.__i, { day: Math.max(1, Math.min(31, parseInt(e.target.value) || 1)) })}
                style={{ ...inputStyle, width: 60 }}/>
              <span style={{ fontSize: 12, color: 'var(--text-3)' }}>日</span>
              <input type="text" value={a.label}
                onChange={e => updateOne(a.__i, { label: e.target.value })}
                placeholder="纪念日名称"
                style={{ ...inputStyle, flex: 1, minWidth: 0 }}/>
              <button onClick={() => removeOne(a.__i)} style={{
                padding: '5px 12px', borderRadius: 6, border: '1px solid var(--border)',
                background: 'var(--danger-soft)', color: 'var(--danger)', cursor: 'pointer',
                fontSize: 12, fontFamily: 'inherit',
              }}>删除</button>
            </div>
          ))}
        </div>

        <div style={{
          marginTop: 14, padding: 12, borderRadius: 8,
          background: 'var(--accent-soft)', border: '1px dashed var(--border-h)',
          display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap',
        }}>
          <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--accent-text)' }}>添加新纪念日</span>
          <input type="number" min="1" max="12" value={draft.month}
            onChange={e => setDraft({ ...draft, month: e.target.value })}
            style={{ ...inputStyle, width: 60 }}/>
          <span style={{ fontSize: 12, color: 'var(--text-3)' }}>月</span>
          <input type="number" min="1" max="31" value={draft.day}
            onChange={e => setDraft({ ...draft, day: e.target.value })}
            style={{ ...inputStyle, width: 60 }}/>
          <span style={{ fontSize: 12, color: 'var(--text-3)' }}>日</span>
          <input type="text" value={draft.label}
            onChange={e => setDraft({ ...draft, label: e.target.value })}
            onKeyDown={e => { if (e.key === 'Enter') addOne(); }}
            placeholder="例如：生日 / 纪念日"
            style={{ ...inputStyle, flex: 1, minWidth: 140 }}/>
          <button onClick={addOne} style={{

      </section>

      <section style={{
        background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 10,
        padding: 16, boxShadow: 'var(--shadow)',

        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-1)' }}>云端同步 (GitHub Gist)</div>
          <span style={{

            fontWeight: 600,
          }}>
            {syncStatus === 'synced' && '已同步'}
            {syncStatus === 'syncing' && '同步中…'}
            {syncStatus === 'error' && '同步失败'}
            {syncStatus === 'disabled' && '未启用'}
          </span>
        </div>
        <div style={{ fontSize: 12, color: 'var(--text-3)', marginBottom: 10 }}>
          {GIST_SYNC_ENABLED()
            ? `已配置 Gist (ID: ${getGistId().slice(0, 8)}…)`
            : '未配置。点击下方按钮填写 Gist ID 和 Token 以启用云端同步。'}
        </div>
        <button onClick={() => window.__openGistSetup && window.__openGistSetup()} style={{
          padding: '7px 16px', borderRadius: 8, border: 'none',

        background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 10,

            <div key={a.id} style={{

  );
}

// ═══ Month View ═══
// Click a day → expand "各月记录" below (same day across months), NOT navigate to day view

function MonthView({ year, month }) {
  const { settings, entries } = useDiary();
  const daysInMonth = getDaysInMonth(year, month);
  const firstDay = getFirstDayOfMonth(year, month);
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() + 1 === month;

  // Selected day for expansion
  const [selectedDay, setSelectedDay] = React.useState(null);

  // Build week rows
  const weeks = [];
  let currentWeek = new Array(7).fill(null);
  let dayNum = 1;
  let weekIdx = 1;
  for (let i = firstDay; dayNum <= daysInMonth; i++) {
    currentWeek[i % 7] = dayNum;
    dayNum++;
    if (i % 7 === 6 || dayNum > daysInMonth) {
      weeks.push({ days: [...currentWeek], weekNum: weekIdx });
      weekIdx++;
      currentWeek = new Array(7).fill(null);
    }
  }

  // Expanded week state
  const [expandedWeek, setExpandedWeek] = React.useState(null);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      {/* Month note */}
      <MonthNoteBanner year={year} month={month}/>

      {/* Calendar grid */}
      <div className="month-grid-container">
        {/* Header row */}
        <div className="month-grid-header">
          <div className="week-num-header">周</div>
          {WEEKDAYS_ZH.map((d, i) => (
            <div key={i} className="weekday-header">{d}</div>
          ))}
        </div>

        {/* Week rows */}
        {weeks.map((week, wi) => (
          <React.Fragment key={wi}>
            <div className="month-grid-row">
              {/* Week number */}
              <button
                className={`week-num-cell ${expandedWeek === wi ? 'active' : ''}`}
                onClick={() => setExpandedWeek(expandedWeek === wi ? null : wi)}
                title={`第${week.weekNum}周 周记`}
              >
                <span className="week-num-label">{week.weekNum}</span>
                <span className="week-expand-icon">{expandedWeek === wi ? '▾' : '▸'}</span>
              </button>

              {/* Day cells */}
              {week.days.map((day, di) => {
                if (day === null) return <div key={di} className="day-cell empty"/>;
                
                const isToday = isCurrentMonth && today.getDate() === day;
                const key = getEntryKey('day', year, month, day);
                const dayEntries = entries[key] || [];
                const anniversary = getAnniversary(settings, month, day);
                const hasEntries = dayEntries.length > 0;
                const isSelected = selectedDay === day;
                
                // Check other months for same day
                const hasOtherMonths = (() => {
                  for (let i = 1; i <= 5; i++) {
                    let m = month - i;
                    let y = year;
                    if (m <= 0) { m += 12; y--; }
                    if (day <= getDaysInMonth(y, m)) {
                      const k = getEntryKey('day', y, m, day);
                      if (entries[k]?.length > 0) return true;
                    }
                  }
                  return false;
                })();

                return (
                  <button
                    key={di}
                    className={`day-cell ${isToday ? 'today' : ''} ${hasEntries ? 'has-entries' : ''} ${isSelected ? 'selected' : ''}`}
                    onClick={() => setSelectedDay(isSelected ? null : day)}
                  >
                    <span className="day-num">{day}</span>
                    <div className="day-indicators">
                      <AuthorDots entries={dayEntries} size={4}/>
                      {hasOtherMonths && <span className="other-months-dot"/>}
                    </div>
                    {anniversary && <span className="anniversary-dot" title={anniversary.label}>·</span>}
                    {hasEntries && (
                      <div className="day-preview-lines">
                        {dayEntries.slice(0, 2).map((e, ei) => {
                          const a = settings.authors.find(x => x.id === e.author);
                          return <div key={ei} className="preview-line" style={{ background: `${a?.color}40` }}/>;
                        })}
                      </div>
                    )}
                  </button>
                );
              })}
            </div>

            {/* Expanded week note */}
            {expandedWeek === wi && (
              <div className="expanded-week-row">
                <div className="expanded-week-content">
                  <WeekNoteBanner year={year} month={month} weekNum={week.weekNum} expanded/>
                  {/* Multi-year week comparison */}
                  <div style={{ marginTop: 8 }}>
                    <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 6 }}>往年 第{week.weekNum}周：</div>
                    {settings.years.filter(y => y !== year).reverse().map(y => {
                      const wkey = getEntryKey('week', y, month, null, week.weekNum);
                      const wentries = entries[wkey] || [];
                      if (wentries.length === 0) return null;
                      return (
                        <div key={y} style={{ padding: '4px 0' }}>
                          <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-2)' }}>{y}</span>
                          {wentries.map(e => <EntryCard key={e.id} entry={e} compact/>)}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </React.Fragment>
        ))}
      </div>

      {/* Selected day: cross-month expansion */}
      {selectedDay !== null && (
        <div className="month-day-expansion" style={{ animation: 'fadeSlideIn 0.2s ease' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
            <h3 style={{ fontSize: 16, fontWeight: 700, color: 'var(--text-1)', fontFamily: 'var(--font-serif)' }}>
              每月{selectedDay}日 · 各月记录
            </h3>
            <button onClick={() => setSelectedDay(null)} style={{
              background: 'none', border: '1px solid var(--border)', borderRadius: 6,
              padding: '3px 10px', cursor: 'pointer', fontSize: 11, color: 'var(--text-3)', fontFamily: 'inherit',
            }}>收起</button>
          </div>
          <MonthAccordion year={year} day={selectedDay} currentMonth={month}/>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { MonthView });

// ═══ Day View ═══

function DayAuthorColumn({ authorId, authorEntries, currentKey }) {
  const { settings, updateEntry, deleteEntry, togglePinEntry } = useDiary();
  const author = settings.authors.find(a => a.id === authorId);
  const wordCount = authorEntries.reduce((s, e) => s + countWords(e.content), 0);
  const pinned = authorEntries.filter(e => e.pinned);
  const unpinned = authorEntries.filter(e => !e.pinned);
  const [showAll, setShowAll] = React.useState(false);

  const renderEntry = (entry) => (
    <EntryCard key={entry.id} entry={entry}
      onEdit={(id, content) => updateEntry(currentKey, id, content)}
      onDelete={(id) => deleteEntry(currentKey, id)}
      onTogglePin={(id) => togglePinEntry(currentKey, id)}/>
  );

  return (
    <div className="day-column" style={{ borderColor: `${author.color}30` }}>
      <div className="day-column-header">
        <span style={{ width: 10, height: 10, borderRadius: '50%', background: author.color }}/>
        <span style={{ fontSize: 14, fontWeight: 600, color: author.color }}>{author.name}</span>
        <span style={{ fontSize: 11, color: 'var(--text-3)', marginLeft: 'auto' }}>
          {pinned.length > 0 && <span style={{ color: 'var(--accent-text)', marginRight: 6 }}>📌{pinned.length}</span>}
          {wordCount}字
        </span>
      </div>
      <div className="day-column-body">
        {authorEntries.length === 0 && (
          <div style={{ padding: 20, textAlign: 'center', color: 'var(--text-3)', fontSize: 13 }}>暂无记录</div>
        )}
        {pinned.map(renderEntry)}
        {unpinned.length > 0 && (
          <button onClick={() => setShowAll(s => !s)} style={{
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            padding: '6px 10px', borderRadius: 8, fontSize: 12, color: 'var(--text-2)',
            background: 'var(--surface-2)', border: '1px dashed var(--border)',
            cursor: 'pointer', fontFamily: 'inherit',
          }}>
            <span>{showAll ? `收起其他 ${unpinned.length} 条` : `展开其他 ${unpinned.length} 条`}</span>
            <span style={{ transition: 'transform 0.2s', transform: showAll ? 'rotate(180deg)' : 'rotate(0)' }}>▾</span>
          </button>
        )}
        {showAll && unpinned.map(renderEntry)}
        <WriteBox entryKey={currentKey} placeholder={`以${author.name}的身份写...`}/>
      </div>
    </div>
  );
}

function DayView({ year, month, day, onBack }) {
  const { settings, entries } = useDiary();
  const weekNum = getMonthWeekNumber(year, month, day);
  const anniversary = getAnniversary(settings, month, day);
  const date = new Date(year, month - 1, day);
  const dayOfWeek = WEEKDAYS_ZH[(date.getDay() + 6) % 7];

  const currentKey = getEntryKey('day', year, month, day);
  const currentEntries = entries[currentKey] || [];
  const humanEntries = currentEntries.filter(e => e.author === 'human');
  const llmEntries = currentEntries.filter(e => e.author === 'llm');
  const [mobileTab, setMobileTab] = React.useState('human');

  return (
    <div className="day-view">
      <div className="day-view-header">
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
          <button onClick={onBack} style={{ ...navBtnStyle, width: 32, height: 32, fontSize: 14 }}>←</button>
          <div>
            <h2 style={{ fontSize: 20, fontWeight: 700, color: 'var(--text-1)', margin: 0, fontFamily: 'var(--font-serif)' }}>
              {month}月{day}日
              <span style={{ fontSize: 14, fontWeight: 400, color: 'var(--text-3)', marginLeft: 8 }}>星期{dayOfWeek}</span>
            </h2>
            <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 2, display: 'flex', gap: 8, flexWrap: 'wrap' }}>

              <span>第{weekNum}周</span>
            </div>
          </div>
        </div>
      </div>

      <WeekNoteBanner year={year} month={month} weekNum={weekNum}/>

      <div className="year-tabs">
        {[...settings.years].reverse().map(y => (
          <button key={y} className={`year-tab ${y === year ? 'active' : ''}`}
            onClick={() => { if (window.__navRef) window.__navRef.setYear(y); }}>{y}</button>
        ))}
      </div>

      <div className="day-columns-desktop">
        <DayAuthorColumn authorId="human" authorEntries={humanEntries} currentKey={currentKey}/>
        <DayAuthorColumn authorId="llm" authorEntries={llmEntries} currentKey={currentKey}/>
      </div>

      <div className="day-columns-mobile">
        <div className="author-tab-bar">
          {settings.authors.map(a => (
            <button key={a.id} className={`author-tab ${mobileTab === a.id ? 'active' : ''}`}

        {mobileTab === 'llm' && <DayAuthorColumn authorId="llm" authorEntries={llmEntries} currentKey={currentKey}/>}
      </div>

      <div className="previous-years-section">
        <div className="section-divider"><span>往年 {month}月{day}日</span></div>
        {settings.years.filter(y => y !== year).reverse().map(y => {
          const k = getEntryKey('day', y, month, day);
          const yEntries = entries[k] || [];
          return (
            <PrevYearDayCard key={y} year={y} entries={yEntries}/>
          );
        })}
      </div>
    </div>
  );
}

function PrevYearDayCard({ year, entries }) {
  const pinned = entries.filter(e => e.pinned);
  const unpinned = entries.filter(e => !e.pinned);
  const [showAll, setShowAll] = React.useState(false);
  const visible = showAll ? entries : (pinned.length > 0 ? pinned : []);

  return (
    <div className="prev-year-card">

          {unpinned.length} 条记录已折叠
        </div>
      )}
    </div>
  );
}
